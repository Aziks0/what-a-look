# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "bun-check",
    name = "bun check",
    language = "system",
    entry = "bun check",
    files = { glob = ["src", "package.json", "tsconfig.json"] },
    include_deleted = true,
    pass_filenames = false,
    fail_fast = true,
  },
  {
    id = "biome-check",
    name = "biome check",
    language = "system",
    entry = "bunx biome check --fix --no-errors-on-unmatched",
  }
]

[[repos]]
repo = "https://codeberg.org/fsfe/reuse-tool"
rev = "ea739bff9c6daa1c4c8a5c5dfd069f3fb0374728" # v6.3.0
hooks = [{ id = "reuse-lint-file" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "6f428aba5ced98b5a579ff23cab6b39822b4347d" # v1.11.2
hooks = [
  { id = "tombi-format" },
  { id = "tombi-lint" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  {
    id = "mixed-line-ending",
    args = [
      "--fix=lf",
    ]
  },
]
